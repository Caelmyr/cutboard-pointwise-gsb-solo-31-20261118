<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CutBoard · 裁片排版</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#edf1ef;color:#193d42}header{background:#193d42;color:white;padding:20px 30px;display:flex;justify-content:space-between}header a{color:#b7e6d4}h1{margin:0;font-size:24px}small{color:#6c7b78}main{display:grid;grid-template-columns:270px 1fr 300px;gap:18px;padding:20px}.panel{background:white;padding:18px;border-radius:10px;box-shadow:0 1px 6px #1231}label{display:block;margin:10px 0 4px}input,select,button,textarea{font:inherit;padding:7px;border:1px solid #c7d4ce;border-radius:5px;max-width:100%}input[type=number]{width:75px}button{cursor:pointer;background:#fff;color:#193d42;margin:4px 0}button.primary{background:#267767;color:white;border-color:#267767}button:hover{filter:brightness(.94)}#canvas{width:100%;max-height:570px;object-fit:contain;image-rendering:auto;background:repeating-conic-gradient(#e6ebe7 0% 25%,white 0% 50%) 50%/16px 16px;border:1px solid #ccd7d0}#status{padding:10px 30px;background:#d7e9e0;min-height:39px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.piece{padding:9px;border:1px solid #d9e1dc;margin-top:7px;cursor:pointer}.piece.active{border-color:#267767;background:#e2f1e9}.links{display:flex;gap:16px;margin:12px 0}.links a{color:#267767}#checks{white-space:pre-wrap}h2{font-size:17px;margin:0 0 12px}.muted{padding:8px;background:#f0f4f1;line-height:1.6}@media(max-width:1000px){main{grid-template-columns:240px 1fr}.detail{grid-column:1/-1}}
</style><header><div><h1>CutBoard</h1><div>把图片裁片排到纸面上 · 手动排版工作台</div></div><a href="/prepare">图片准备室 →</a></header><div id="status">正在读取工作区</div><main>
<section class="panel"><h2>素材与排版</h2><button id="demo" class="primary">加入合成卡片</button><label>上传PNG/JPEG</label><input type="file" id="upload" accept="image/*"><label>原图素材</label><select id="images" style="width:100%"></select><img id="source" style="width:100%;max-height:160px;object-fit:contain;margin-top:10px"><div class="row"><span>成品宽高</span><input id="addW" type="number" value="80"><input id="addH" type="number" value="50"></div><label>分组</label><input id="addGroup" value="A组"><button id="add">加入当前排版</button><hr><label>已有排版</label><select id="layouts" style="width:100%"></select><label>新排版名称</label><input id="newName" value="卡片小批量"><div class="row"><input id="newW" type="number" value="320"><span>×</span><input id="newH" type="number" value="240"></div><button id="new" class="primary">建立空白排版</button><label>恢复layout.json（原素材需在本工作区）</label><input id="import" type="file" accept=".json"></section>
<section class="panel"><div class="row" style="justify-content:space-between"><h2 id="title">纸面预览</h2><div><button id="undo">撤销</button> <button id="redo">重做</button> <button id="copy">复制排版</button></div></div><div class="row"><label>页号 <input id="page" type="number" value="1" min="1" max="20"></label><label><input id="guides" type="checkbox" checked> 裁片名称与边界</label></div><img id="canvas"><div class="links"><a id="png" download>下载当前页PNG</a><a id="zip" download>下载完整ZIP</a></div><div id="summary" class="muted">建立排版后加入素材</div><h2 style="margin-top:20px">检查结果</h2><div id="checks"></div><small>纸面单位为像素；间隔只做检查，普通手动排版允许暂存越界或重叠。当前不提供自动排版和直切工序。</small></section>
<section class="panel detail"><h2>裁片与纸面设置</h2><div class="row"><label>纸宽<input id="sheetW" type="number"></label><label>纸高<input id="sheetH" type="number"></label><label>间隔<input id="gap" type="number" value="4"></label><label>纸色<input id="bg" type="color" value="#ffffff"></label></div><button id="sheet">保存纸面设置</button><div id="pieces"></div><div id="editor" hidden><hr><label>裁片名称</label><input id="pieceName"><label>分组</label><input id="group"><div class="row"><label>宽<input id="w" type="number"></label><label>高<input id="h" type="number"></label><label>X<input id="x" type="number"></label><label>Y<input id="y" type="number"></label><label>页<input id="p" type="number"></label></div><label>旋转<select id="rotation"><option value="0">0°</option><option value="90">90°</option></select></label><label><input id="allow" type="checkbox"> 允许后续旋转</label><button id="savePiece" class="primary">应用裁片设置</button><div class="row"><button id="dupPiece">复制裁片</button><button id="delete">删除裁片</button></div><label>原图裁剪框 左,上,右,下</label><input id="crop"><div class="row"><button id="saveCrop">应用裁剪</button><button id="trim">去透明边</button></div></div></section></main>
<script>
let state,layout,selected;const $=id=>document.getElementById(id);const value=id=>$(id).value;const num=id=>Number(value(id));
async function api(path,data){let opt=data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)};let r=await fetch('/cutboard'+path,opt),j=await r.json();if(!r.ok)throw Error(j.error||j.message||JSON.stringify(j));return j}
function status(t){$('status').textContent=t}
async function run(fn){try{await fn();status('已保存 · '+new Date().toLocaleTimeString())}catch(e){status('操作未完成：'+e.message)}}
async function refresh(){state=await api('/state');let im=value('images'),la=layout?.id||value('layouts');$('images').replaceChildren(...state.images.map(r=>new Option(r.name+' '+r.width+'×'+r.height,r.id)));if(state.images.some(r=>r.id===im))$('images').value=im;source();$('layouts').replaceChildren(new Option('选择排版',''),...state.layouts.map(r=>new Option(r.name,r.id)));$('layouts').value=la||''}
function source(){let id=value('images');$('source').src=id?'/cutboard/images/'+id+'.png':''}
function preview(){if(!layout)return;let url='/cutboard/layouts/'+layout.id+'.png?page='+num('page');$('canvas').src=url+'&guides='+($('guides').checked?'1':'0')+'&r='+layout.revision;$('png').href=url+'&download=1';$('zip').href='/cutboard/layouts/'+layout.id+'.zip'}
function draw(j){layout=j.layout;let s=j.summary;selected=layout.pieces.some(q=>q.id===selected)?selected:layout.pieces[0]?.id;$('title').textContent=layout.name+' · r'+layout.revision;$('sheetW').value=layout.width;$('sheetH').value=layout.height;$('gap').value=layout.gap;$('bg').value=layout.background;$('summary').textContent=`${s.count} 个裁片 · ${s.pages.length} 页 · 图像面积占比 ${(s.utilization*100).toFixed(1)}% · 分组 ${s.groups.join(' / ')}`;$('checks').textContent=s.issues.length?s.issues.map(i=>i.kind==='outside'?'越界：'+name(i.piece):'相交或间隔不足：'+i.pieces.map(name).join(' / ')).join('\n'):'当前裁片边界与间隔检查通过';$('pieces').replaceChildren(...layout.pieces.map(q=>{let d=document.createElement('div');d.className='piece'+(q.id===selected?' active':'');d.textContent=q.name+' · '+q.group+' · 页'+q.page+' '+q.width+'×'+q.height;d.onclick=()=>{selected=q.id;draw(j)};return d}));editor();preview()}
function name(id){return layout.pieces.find(q=>q.id===id)?.name||id}
function editor(){let q=layout.pieces.find(q=>q.id===selected);$('editor').hidden=!q;if(!q)return;for(let [id,k]of Object.entries({pieceName:'name',group:'group',w:'width',h:'height',x:'x',y:'y',p:'page',rotation:'rotation'}))$(id).value=q[k];$('allow').checked=q.allow_rotate;$('crop').value=q.crop.join(',')}
async function load(id){draw(await api('/layouts/'+id));await refresh()}
async function edit(action,data={}){if(!layout)throw Error('请先建立或选择排版');draw(await api('/layouts/'+layout.id+'/edit',{revision:layout.revision,action,piece_id:selected,...data}));await refresh()}
$('demo').onclick=()=>run(async()=>{await api('/demo',{});await refresh()});$('upload').onchange=()=>run(async()=>{let f=new FormData();f.append('file',$('upload').files[0]);let r=await fetch('/cutboard/upload',{method:'POST',body:f});let j=await r.json();if(!r.ok)throw Error(j.error);await refresh()});$('images').onchange=source;$('layouts').onchange=()=>run(()=>load(value('layouts')));$('new').onclick=()=>run(async()=>{draw(await api('/layouts',{name:value('newName'),width:num('newW'),height:num('newH')}));await refresh()});$('add').onclick=()=>run(()=>edit('add',{image_id:value('images'),width:num('addW'),height:num('addH'),group:value('addGroup')}));$('sheet').onclick=()=>run(()=>edit('sheet',{width:num('sheetW'),height:num('sheetH'),gap:num('gap'),background:value('bg')}));$('savePiece').onclick=()=>run(()=>edit('piece',{name:value('pieceName'),group:value('group'),width:num('w'),height:num('h'),x:num('x'),y:num('y'),page:num('p'),rotation:num('rotation'),allow_rotate:$('allow').checked}));$('saveCrop').onclick=()=>run(()=>edit('crop',{crop:value('crop').split(',').map(Number)}));$('trim').onclick=()=>run(()=>edit('trim'));$('delete').onclick=()=>run(()=>edit('delete'));$('dupPiece').onclick=()=>run(()=>edit('duplicate'));for(let a of ['undo','redo'])$(a).onclick=()=>run(async()=>{if(!layout)throw Error('请选择排版');draw(await api('/layouts/'+layout.id+'/history',{revision:layout.revision,action:a}));await refresh()});$('copy').onclick=()=>run(async()=>{draw(await api('/layouts/'+layout.id+'/duplicate',{}));await refresh()});$('page').onchange=preview;$('guides').onchange=preview;$('import').onchange=()=>run(async()=>{draw(await api('/import',{layout:JSON.parse(await $('import').files[0].text())}));await refresh()});run(refresh);
</script></html>
